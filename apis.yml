- aid: happyscribe:happyscribe-uploads-api
  name: Happy Scribe Uploads API
  tags:
  - Uploads
  - Files
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://dev.happyscribe.com/sections/product/
  baseURL: https://www.happyscribe.com/api/v1
  properties:
  - url: https://dev.happyscribe.com/sections/product/
    type: Documentation
  - url: openapi/happyscribe-openapi.yml
    type: OpenAPI
  description: Request a signed upload URL for a local media file, then PUT the
    file to that URL and pass the resulting temporary URL when creating a
    transcription or order. The ingestion path for files not already hosted at a
    public URL.
- aid: happyscribe:happyscribe-glossaries-style-guides-api
  name: Happy Scribe Glossaries and Style Guides API
  tags:
  - Glossaries
  - Style Guides
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://dev.happyscribe.com/sections/product/
  baseURL: https://www.happyscribe.com/api/v1
  properties:
  - url: https://dev.happyscribe.com/sections/product/
    type: Documentation
  - url: openapi/happyscribe-openapi.yml
    type: OpenAPI
  description: List the glossaries and style guides available in an organization so
    they can be attached to orders to improve transcription accuracy and enforce
    formatting conventions.
