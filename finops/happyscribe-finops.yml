meters:
- name: ai_minutes
  description: Minutes of media processed by automatic transcription, subtitling, or translation, drawn from plan credits.
  unit: minutes
  aggregation: sum
  dimensions:
  - organization
  - service
- name: human_minutes
  description: Minutes of media processed by professional (human) transcription or subtitling, billed per minute.
  unit: minutes
  aggregation: sum
  dimensions:
  - organization
  - service
- name: translation_minutes
  description: Minutes of media translated into additional languages.
  unit: minutes
  aggregation: sum
  dimensions:
  - organization
- name: seats
  description: Additional user seats beyond the plan default.
  unit: seats
  aggregation: max
  dimensions:
  - organization
principles:
- name: Visibility
  description: Track minutes transcribed per organization and per service (auto vs. human) so spend maps to workloads and teams.
- name: Allocation
  description: Use organizations and folders to attribute transcription minutes to internal cost centers.
- name: Optimization
  description: Prefer automatic service where accuracy allows; reserve human proofreading for high-stakes content; avoid redundant re-exports and translation passes; right-size the subscription tier to expected monthly minutes.
- name: Accountability
  description: Assign an owner per organization and review monthly AI/human minute consumption against plan allowances and top-ups.
