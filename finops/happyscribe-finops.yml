description: >-
  FinOps view of Happy Scribe spend. Cost is driven by minutes of media
  processed, not by API call volume. A monthly subscription provides a fixed AI
  (automatic) minute allowance for transcription, subtitling, and translation;
  usage above the allowance is topped up per minute of media, and professional
  (human) services are billed separately per minute. API usage draws down the same
  balance as the web app, so cost governance is about controlling how many minutes
  of audio/video are submitted and whether human service is used.
notes: >-
  Per-unit rates are on the Happy Scribe pricing page and are captured in
  plans/happyscribe-plans-pricing.yml; they are not reconciled here. Dominant cost
  levers are total minutes transcribed, automatic vs. human service, extra
  translation passes, and additional user seats.
